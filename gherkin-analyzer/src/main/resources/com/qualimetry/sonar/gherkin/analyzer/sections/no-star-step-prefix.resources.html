<h2>See Also</h2>
<p>
  The <code>no-unknown-step-type</code> rule separately flags steps whose
  semantic type cannot be determined (including <code>*</code> steps that
  are the first step in a scenario). This rule focuses solely on the
  literal keyword, while <code>no-unknown-step-type</code> handles the
  semantic classification concern.
</p>
